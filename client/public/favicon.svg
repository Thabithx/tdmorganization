<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="frostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#040810"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="url(#frostGrad)" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Snowflake / Diamond Frost Emblem -->
  <g filter="url(#glow)">
    <path d="M50 15 L50 85 M15 50 L85 50 M25 25 L75 75 M25 75 L75 25" stroke="url(#frostGrad)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="50,30 56,44 70,50 56,56 50,70 44,56 30,50 44,44" fill="#DDF7FF"/>
  </g>
</svg>